<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stem Detection - Cat / Dog / Human</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🐱🐶🧑 Stem Detection</h1>
    <p>Real-time Cat / Dog / Human classifier</p>
  </header>

  <main>
    <section class="camera">
      <video id="video" autoplay playsinline muted></video>
      <p class="hint">Allow camera access and point at a cat, dog, or person. Detection is live and automatic.</p>
    </section>

    <section class="result" id="result">
      <div class="placeholder">No prediction yet</div>
    </section>
  </main>

  <p class="status" id="status">Starting camera…</p>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
